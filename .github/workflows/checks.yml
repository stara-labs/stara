name: Scaffold checks

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *'

permissions:
  contents: read

concurrency:
  group: scaffold-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Candidate verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps
      - name: Install checksum-pinned Terraform
        shell: bash
        run: |
          set -euo pipefail
          directory="$(mktemp -d "$RUNNER_TEMP/stara-terraform.XXXXXX")"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://releases.hashicorp.com/terraform/1.16.2/terraform_1.16.2_linux_amd64.zip \
            --output "$directory/terraform.zip"
          printf '%s  %s\n' 0d17011f0c4664539b164b044903d04e296c86c13cb9f28040076c65cfb3985a "$directory/terraform.zip" | sha256sum --check --strict
          unzip -q "$directory/terraform.zip" -d "$directory"
          sudo install -m 0755 "$directory/terraform" /usr/local/bin/terraform
          sudo install -D -m 0644 "$directory/LICENSE.txt" /usr/local/share/licenses/terraform/LICENSE.txt
      - name: Verify backend-free Terraform plans
        shell: bash
        run: |
          set -euo pipefail
          for module in bootstrap delivery target; do
            terraform -chdir=infra/gcp/$module fmt -check -recursive
            terraform -chdir=infra/gcp/$module init -backend=false -input=false -lockfile=readonly
            terraform -chdir=infra/gcp/$module validate
            terraform -chdir=infra/gcp/$module test
          done
      - name: Complete proposed-change gates
        if: github.event_name == 'pull_request'
        run: pnpm check:pr
      - name: Full candidate verification
        if: github.event_name != 'pull_request'
        run: pnpm validate
      - name: Targeted control mutation evaluation
        if: github.event_name != 'pull_request'
        run: pnpm test:mutation
      - run: pnpm security:dependencies
      - name: Export complete mainline target coverage
        if: github.event_name == 'push'
        run: pnpm release:coverage
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: github.event_name == 'push'
        with:
          name: release-coverage-${{ github.sha }}-${{ github.run_attempt }}
          path: .artifacts/public-release/coverage.json
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .artifacts/coverage/**/coverage-summary.json
            .artifacts/gates/**/selection.json
            .artifacts/gates/**/results.json
            .artifacts/build/manifest.json
            tests/e2e/.artifacts/run-*/run.json
            tests/e2e/.artifacts/run-*/results/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error

  windows:
    name: Windows package verification
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tokens:check
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm security:secrets
      - run: pnpm test:coverage
      - run: pnpm build
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: windows-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .artifacts/coverage/**/coverage-summary.json
            .artifacts/build/manifest.json
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error

  containers:
    name: Container journeys
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm start
      - name: Repeated startup preserves the environment
        run: pnpm start
      - run: pnpm exec playwright install --with-deps
      - run: pnpm test:e2e
        env:
          STARA_EXTERNAL_SERVERS: '1'
          STARA_E2E_BASE_URL: http://127.0.0.1:5173
      - run: pnpm test:a11y
        env:
          STARA_EXTERNAL_SERVERS: '1'
          STARA_E2E_BASE_URL: http://127.0.0.1:5173
      - name: Retain service diagnostics
        if: always()
        run: |
          mkdir -p .artifacts
          pnpm environment:logs > .artifacts/compose.log 2>&1
      - name: Stop only this checkout's services
        if: always()
        run: pnpm environment:down
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: containers-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            tests/e2e/.artifacts/run-*/run.json
            tests/e2e/.artifacts/run-*/results/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error

  release-images:
    name: Release image verification
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      STARA_RELEASE_RUN_ID: checks-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps
      - run: pnpm release:images
      - run: pnpm release:safety
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: release-images-${{ github.sha }}-${{ github.run_attempt }}
          path: .artifacts/public-release/results.json
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error

  required:
    name: Required scaffold checks
    if: always()
    needs: [verify, windows, containers, release-images]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Reject failed, canceled, missing, or unexpectedly skipped checks
        env:
          EVENT: ${{ github.event_name }}
          VERIFY: ${{ needs.verify.result }}
          WINDOWS: ${{ needs.windows.result }}
          CONTAINERS: ${{ needs.containers.result }}
          RELEASE_IMAGES: ${{ needs.release-images.result }}
        run: |
          test "$VERIFY" = success
          test "$CONTAINERS" = success
          test "$WINDOWS" = success
          test "$RELEASE_IMAGES" = success
